<!DOCTYPE html>
<html>
	<head>
		<title>My Template</title>
		<meta charset="UTF-8">
		<style>
			/* Hide native caret in the hidden textarea used by Godot */
			textarea {
				caret-color: transparent !important;
				position: absolute !important;
				clip: rect(0 0 0 0) !important;
				overflow: hidden !important;
			}
		</style>
	</head>
	<body>

            const engine = new Engine();

            //     return engine.start({ args: ['--main-pack', myPck] });
            // }).then(() => {
            //     console.log('Engine has started!');

            Promise.all([
                engine.init(myWasm),
                engine.preloadFile(myPck),

                return engine.start({
                    args: ['--main-pack', myPck],
                    experimentalVK: true,
                });
            }).then(() => {
                console.log('Engine has started!');
                // console.log('Engine has started with virtual keyboard support!');
            });

		</script>
	</body>
